[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsim"
version = "0.1.0"
description = "A from-scratch quantum computer simulator built on NumPy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ernur Teginbaev" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
verify = ["qiskit>=1.0"]
dev = ["pytest>=7.0", "hypothesis>=6.100", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["qsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
